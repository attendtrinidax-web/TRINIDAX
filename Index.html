<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root{--navy:#101b2d;--navy2:#192941;--teal:#2dd4bf;--ink:#172033;--muted:#6b778c;--bg:#f4f7fb;--line:#e4eaf2;--white:#fff;--red:#c24141}
    *{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial;background:var(--bg);color:var(--ink)}
    button,input,select{font:inherit}button{cursor:pointer}.shell{min-height:100vh;display:grid;grid-template-columns:250px 1fr}
    aside{background:var(--navy);color:#eaf1fb;padding:24px 16px;display:flex;flex-direction:column;gap:28px}
    .brand{display:flex;align-items:center;gap:12px;padding:0 8px}.logo{width:44px;height:44px;border-radius:14px;background:var(--teal);color:var(--navy);display:grid;place-items:center;font-size:23px;font-weight:900}
    .brand strong{display:block;font-size:18px;letter-spacing:1.5px}.brand small{color:#aebbd0}.nav{display:grid;gap:8px}.nav button{border:0;text-align:left;color:#bdc9db;background:transparent;padding:13px 14px;border-radius:12px;display:flex;gap:12px;align-items:center}
    .nav button.active,.nav button:hover{background:var(--navy2);color:#fff}.nav button.active{box-shadow:inset 3px 0 var(--teal)}.side-note{margin-top:auto;color:#91a2bc;font-size:12px;line-height:1.6;padding:12px}
    main{padding:28px 34px;min-width:0}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:26px}.eyebrow{color:var(--muted);font-size:13px}.top h1{margin:4px 0;font-size:27px;letter-spacing:-.7px}.profile{display:flex;gap:10px;align-items:center;background:#fff;border:1px solid var(--line);padding:8px 12px;border-radius:14px}.avatar{width:36px;height:36px;border-radius:12px;background:#d7f7f1;color:#087f72;display:grid;place-items:center;font-weight:800}
    .grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 3px 12px #17203305}.stat{display:flex;justify-content:space-between;gap:12px}.stat-icon{width:44px;height:44px;border-radius:13px;background:#e5faf6;color:#138779;display:grid;place-items:center;font-size:20px}.stat strong{display:block;font-size:27px;margin-top:14px}.stat span{color:var(--muted);font-size:13px}.section{margin-top:22px}.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.section-head h2{margin:0;font-size:18px}.btn{border:0;background:var(--navy);color:#fff;border-radius:11px;padding:11px 15px;font-weight:650}.btn.teal{background:var(--teal);color:#0e2937}.btn.light{background:#eef3f8;color:#24354c}.btn.danger{background:#fff0f0;color:#a12c2c}.btn:disabled{opacity:.55;cursor:not-allowed}
    .table-wrap{overflow:auto;border:1px solid var(--line);border-radius:15px;background:#fff}table{width:100%;border-collapse:collapse;min-width:620px}th,td{text-align:left;padding:14px 16px;border-bottom:1px solid #edf1f6;font-size:13px}th{background:#f9fbfd;color:#728096;font-size:11px;letter-spacing:.6px;text-transform:uppercase}tr:last-child td{border-bottom:0}.pill{display:inline-block;border-radius:999px;padding:5px 9px;background:#e8f9f2;color:#157553;font-size:11px;font-weight:750}.muted{color:var(--muted)}.empty{padding:26px;text-align:center;color:var(--muted)}
    .two{display:grid;grid-template-columns:1.3fr 1fr;gap:16px}.checkin{background:linear-gradient(135deg,#102036,#1d3c54);color:#fff;border:0;min-height:220px;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between}.checkin p{color:#b8c7d8;max-width:420px;line-height:1.6}.checkin .btn{margin-top:12px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field{display:grid;gap:6px}.field label{font-size:12px;color:#617087;font-weight:700}.field input,.field select{width:100%;padding:12px;border:1px solid #dbe3ed;border-radius:10px;background:#fff;outline:none}.field input:focus,.field select:focus{border-color:#2bbda9;box-shadow:0 0 0 3px #2dd4bf24}.field.full{grid-column:1/-1}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}.message{margin:12px 0;padding:12px 14px;border-radius:11px;background:#e7f8f1;color:#17664e;font-size:13px}.message.error{background:#fff0f0;color:#a12c2c}.hidden{display:none!important}.auth{min-height:100vh;display:grid;grid-template-columns:1.05fr 1fr;background:#fff}.auth-hero{background:var(--navy);color:#fff;padding:8vw 6vw;display:flex;flex-direction:column;justify-content:center}.auth-hero h1{font-size:clamp(34px,4vw,56px);line-height:1.05;letter-spacing:-2px;margin:30px 0 16px}.auth-hero p{color:#b5c4d9;line-height:1.7;max-width:460px}.auth-panel{padding:40px;display:grid;place-items:center}.auth-card{width:min(100%,410px)}.auth-card h2{font-size:28px;margin-bottom:8px}.auth-card>p{color:var(--muted);font-size:14px;margin-bottom:24px}.auth-card .field{margin-bottom:14px}.auth-card .btn{width:100%;margin-top:8px}.linkbtn{border:0;background:none;color:#087f72;text-decoration:underline;padding:12px 0}.mobile-head{display:none}
    @media(max-width:1050px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.shell{grid-template-columns:210px 1fr}main{padding:24px}.two{grid-template-columns:1fr}}
    @media(max-width:700px){.shell{display:block}aside{display:none}main{padding:20px 14px 90px}.top{align-items:flex-start}.top h1{font-size:23px}.profile .user-meta{display:none}.grid{gap:10px}.card{padding:15px;border-radius:15px}.stat strong{font-size:23px}.stat-icon{width:38px;height:38px}.mobile-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.mobile-nav{position:fixed;z-index:5;bottom:0;left:0;right:0;display:flex;justify-content:space-around;background:#fff;border-top:1px solid var(--line);padding:8px 3px calc(8px + env(safe-area-inset-bottom))}.mobile-nav button{border:0;background:none;color:#718096;font-size:10px;display:grid;gap:4px;justify-items:center;padding:5px}.mobile-nav button.active{color:#078a7a;font-weight:800}.mobile-nav span{font-size:19px}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.auth{grid-template-columns:1fr}.auth-hero{padding:30px 24px}.auth-hero h1{font-size:36px;margin:18px 0 10px}.auth-hero p{margin:0}.auth-panel{padding:28px 22px}.auth-hero .brand{padding:0}.section-head{align-items:flex-start;flex-direction:column}.table-wrap{border-radius:12px}}
  </style>
</head>
<body>
<div id="app"></div>
<script>
const state={token:sessionStorage.getItem('trinidax_token')||'',user:JSON.parse(sessionStorage.getItem('trinidax_user')||'null'),page:'dashboard',users:[],attendance:[],message:'',error:false};
function api(action,payload={}){return new Promise((resolve,reject)=>google.script.run.withSuccessHandler(r=>r&&r.ok?resolve(r.data):reject(new Error(r&&r.error||'Request failed'))).withFailureHandler(e=>reject(new Error(e.message||'Connection failed'))).api(action,payload));}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function initials(name){return String(name||'T').split(/\s+/).slice(0,2).map(x=>x[0]||'').join('').toUpperCase();}
function flash(msg,error=false){state.message=msg;state.error=error;render();setTimeout(()=>{state.message='';render();},4500);}
function shellIcon(icon){return `<span>${icon}</span>`;}
function navItems(){let a=[['dashboard','⌂','Dashboard'],['attendance','◷','My attendance'],['password','⚿','Password']];if(state.user.role==='admin')a.splice(1,0,['users','♙','User management'],['reports','▤','Reports']);return a;}
function render(){if(!state.user){renderAuth();return;}const nav=navItems();document.getElementById('app').innerHTML=`
<div class="shell"><aside><div class="brand"><div class="logo">T</div><div><strong>TRINIDAX</strong><small>Attendance system</small></div></div>
<nav class="nav">${nav.map(n=>`<button class="${state.page===n[0]?'active':''}" onclick="go('${n[0]}')">${shellIcon(n[1])}${n[2]}</button>`).join('')}</nav>
<div class="side-note">Secure attendance, simplified.<br>Location-enabled check-in.</div></aside>
<main><div class="mobile-head"><div class="brand"><div class="logo">T</div><div><strong>TRINIDAX</strong><small>Attendance system</small></div></div><button class="btn light" onclick="logout()">Sign out</button></div>
<div class="top"><div><div class="eyebrow">TRINIDAX / ${esc(state.page.replace(/^\w/,c=>c.toUpperCase()))}</div><h1>${pageTitle()}</h1></div><div class="profile"><div class="avatar">${esc(initials(state.user.fullName))}</div><div class="user-meta"><b>${esc(state.user.fullName)}</b><div class="eyebrow">${esc(state.user.role)}</div></div><button class="btn light" onclick="logout()">Exit</button></div></div>
${state.message?`<div class="message ${state.error?'error':''}">${esc(state.message)}</div>`:''}
<div id="content">${contentHtml()}</div></main>
<nav class="mobile-nav">${nav.map(n=>`<button class="${state.page===n[0]?'active':''}" onclick="go('${n[0]}')"><span>${n[1]}</span>${n[2]}</button>`).join('')}</nav></div>`;
if(state.page==='users')loadUsers();if(state.page==='reports')loadReports();if(state.page==='attendance')loadMyAttendance();}
function pageTitle(){return ({dashboard:'Good day, '+state.user.fullName.split(' ')[0],users:'User management',attendance:'My attendance',reports:'Attendance reports',password:'Account security'})[state.page]||'Dashboard';}
function contentHtml(){if(state.page==='dashboard')return dashboardHtml();if(state.page==='users')return usersHtml();if(state.page==='attendance')return attendanceHtml();if(state.page==='reports')return reportsHtml();if(state.page==='password')return passwordHtml();return dashboardHtml();}
function dashboardHtml(){return `<div class="grid">
<div class="card stat"><div><span>Account role</span><strong style="font-size:22px">${esc(state.user.role)}</strong><span>Access level</span></div><div class="stat-icon">♙</div></div>
<div class="card stat"><div><span>Today's attendance</span><strong id="todayStat">—</strong><span>Check in to record presence</span></div><div class="stat-icon">◷</div></div>
<div class="card stat"><div><span>Location services</span><strong style="font-size:20px">GPS</strong><span>Permission required</span></div><div class="stat-icon">⌖</div></div>
<div class="card stat"><div><span>Account status</span><strong style="font-size:20px">Active</strong><span>Signed in securely</span></div><div class="stat-icon">✓</div></div></div>
<div class="section two"><div class="card checkin"><div><div class="eyebrow" style="color:#8ee9dd">LOCATION-BASED ATTENDANCE</div><h2>Ready to check in?</h2><p>Allow location access so TRINIDAX can validate your current position and record today's attendance.</p></div><button class="btn teal" onclick="checkIn()">⌖ &nbsp; Mark attendance</button></div>
<div class="card"><div class="section-head"><h2>Quick actions</h2></div><p class="muted" style="line-height:1.7">Review your attendance history, keep your password secure, and make sure location permission is enabled on your device.</p><div class="actions"><button class="btn light" onclick="go('attendance')">View history</button><button class="btn light" onclick="go('password')">Change password</button></div></div></div>
<div class="section card"><div class="section-head"><h2>Recent attendance</h2><button class="btn light" onclick="go('attendance')">View all</button></div><div id="recentAttendance" class="empty">Loading your records…</div></div>`;}
function usersHtml(){return `<div class="card"><div class="section-head"><div><h2>Register a user</h2><div class="eyebrow">Create a student, staff, or administrator account</div></div></div>
<form onsubmit="registerUser(event)"><div class="form-grid"><div class="field"><label>FULL NAME</label><input name="fullName" required maxlength="100" placeholder="e.g. Alex Johnson"></div><div class="field"><label>EMAIL ADDRESS</label><input name="email" type="email" required placeholder="name@example.com"></div><div class="field"><label>ROLE</label><select name="role"><option value="student">Student</option><option value="staff">Staff</option><option value="admin">Admin</option></select></div><div class="field"><label>TEMPORARY PASSWORD</label><input name="password" type="password" minlength="8" required placeholder="At least 8 characters"></div></div><div class="actions"><button class="btn" type="submit">Create account</button></div></form></div>
<div class="section card"><div class="section-head"><div><h2>Registered users</h2><div class="eyebrow">Deactivate accounts while preserving attendance history</div></div><button class="btn light" onclick="loadUsers()">Refresh</button></div><div id="usersTable" class="empty">Loading users…</div></div>`;}
function attendanceHtml(){return `<div class="card"><div class="section-head"><div><h2>Your attendance history</h2><div class="eyebrow">Latest 100 records</div></div><button class="btn light" onclick="loadMyAttendance()">Refresh</button></div><div id="myAttendanceTable" class="empty">Loading records…</div></div>`;}
function reportsHtml(){return `<div class="card"><div class="section-head"><div><h2>Attendance records</h2><div class="eyebrow">Administrator view · latest 500 records</div></div><button class="btn light" onclick="loadReports()">Refresh</button></div><div id="reportsTable" class="empty">Loading records…</div></div>`;}
function passwordHtml(){return `<div class="card" style="max-width:650px"><h2>Change password</h2><p class="muted">Use at least 8 characters. Never share your password.</p><form onsubmit="changePassword(event)"><div class="field" style="margin:16px 0"><label>CURRENT PASSWORD</label><input name="oldPassword" type="password" required autocomplete="current-password"></div><div class="field" style="margin:16px 0"><label>NEW PASSWORD</label><input name="newPassword" type="password" required minlength="8" autocomplete="new-password"></div><div class="field" style="margin:16px 0"><label>CONFIRM NEW PASSWORD</label><input name="confirmPassword" type="password" required minlength="8" autocomplete="new-password"></div><button class="btn" type="submit">Update password</button></form></div>`;}
function renderAuth(){document.getElementById('app').innerHTML=`<div class="auth"><section class="auth-hero"><div class="brand"><div class="logo">T</div><div><strong>TRINIDAX</strong><small>Attendance Management System</small></div></div><h1>Show up.<br>Check in.<br><span style="color:var(--teal)">Stay on track.</span></h1><p>A simpler, smarter way to manage attendance with role-based access and location-aware check-ins.</p><div style="margin-top:38px;color:#8297b4;font-size:12px">WEB · ANDROID · GOOGLE WORKSPACE</div></section><section class="auth-panel"><div class="auth-card"><div class="eyebrow">WELCOME TO TRINIDAX</div><h2>Sign in to your account</h2><p>Enter your registered email and password to continue.</p>${state.message?`<div class="message ${state.error?'error':''}">${esc(state.message)}</div>`:''}<form onsubmit="login(event)"><div class="field"><label>EMAIL ADDRESS</label><input name="email" type="email" required autocomplete="username" placeholder="you@example.com"></div><div class="field"><label>PASSWORD</label><input name="password" type="password" required autocomplete="current-password" placeholder="Enter your password"></div><button class="btn" type="submit">Sign in securely</button></form><div style="text-align:center;margin-top:18px"><button class="linkbtn" onclick="showRegister()">Create a student or staff account</button></div><div id="registerPanel" class="hidden" style="margin-top:16px;border-top:1px solid var(--line);padding-top:16px"><h3>Create account</h3><form onsubmit="selfRegister(event)"><div class="field"><label>FULL NAME</label><input name="fullName" required></div><div class="field"><label>EMAIL</label><input name="email" type="email" required></div><div class="field"><label>ROLE</label><select name="role"><option value="student">Student</option><option value="staff">Staff</option></select></div><div class="field"><label>PASSWORD (8+ CHARACTERS)</label><input name="password" type="password" minlength="8" required></div><button class="btn" type="submit">Register</button></form></div></div></section></div>`;}
function showRegister(){document.getElementById('registerPanel').classList.toggle('hidden');}
async function login(e){e.preventDefault();const f=new FormData(e.target);try{const r=await api('login',{email:f.get('email'),password:f.get('password')});state.token=r.token;state.user=r.user;sessionStorage.setItem('trinidax_token',r.token);sessionStorage.setItem('trinidax_user',JSON.stringify(r.user));state.page='dashboard';state.message='';render();loadMyAttendance();}catch(err){flash(err.message,true);}}
async function selfRegister(e){e.preventDefault();const f=new FormData(e.target);try{await api('register',{fullName:f.get('fullName'),email:f.get('email'),role:f.get('role'),password:f.get('password')});flash('Account created. Please sign in.');renderAuth();}catch(err){flash(err.message,true);}}
async function registerUser(e){e.preventDefault();const f=new FormData(e.target);try{await api('register',{token:state.token,fullName:f.get('fullName'),email:f.get('email'),role:f.get('role'),password:f.get('password')});e.target.reset();flash('User account created.');loadUsers();}catch(err){flash(err.message,true);}}
async function changePassword(e){e.preventDefault();const f=new FormData(e.target);if(f.get('newPassword')!==f.get('confirmPassword')){flash('New passwords do not match.',true);return;}try{await api('changePassword',{token:state.token,oldPassword:f.get('oldPassword'),newPassword:f.get('newPassword')});e.target.reset();flash('Password updated successfully.');}catch(err){flash(err.message,true);}}
async function checkIn(){if(!navigator.geolocation){flash('This device does not support location services.',true);return;}flash('Checking your location…');navigator.geolocation.getCurrentPosition(async pos=>{try{const r=await api('checkIn',{token:state.token,latitude:pos.coords.latitude,longitude:pos.coords.longitude});flash(r.message);loadMyAttendance();}catch(err){flash(err.message,true);}},err=>flash(err.code===1?'Location permission was denied. Enable it in your browser settings.':'Could not get your location. Try again in an open area.',true),{enableHighAccuracy:true,timeout:15000,maximumAge:0});}
async function loadUsers(){try{state.users=await api('listUsers',{token:state.token});const el=document.getElementById('usersTable');if(!el)return;el.innerHTML=state.users.length?`<div class="table-wrap"><table><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Action</th></tr></thead><tbody>${state.users.map(u=>`<tr><td><b>${esc(u.fullName)}</b></td><td>${esc(u.email)}</td><td><span class="pill">${esc(u.role)}</span></td><td><button class="btn danger" onclick="deleteUser('${esc(u.userId)}','${esc(u.fullName)}')">Deactivate</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No users registered yet.</div>';}catch(err){flash(err.message,true);}}
async function deleteUser(id,name){if(!confirm('Deactivate '+name+'? Their attendance history will be preserved.'))return;try{await api('deleteUser',{token:state.token,userId:id});flash('Account deactivated.');loadUsers();}catch(err){flash(err.message,true);}}
async function loadMyAttendance(){try{state.attendance=await api('myAttendance',{token:state.token});const html=attendanceTable(state.attendance,false);const el=document.getElementById('myAttendanceTable');if(el)el.innerHTML=html;const recent=document.getElementById('recentAttendance');if(recent)recent.innerHTML=state.attendance.length?attendanceTable(state.attendance.slice(0,5),false):'<div class="empty">No attendance records yet. Your first check-in will appear here.</div>';const today=document.getElementById('todayStat');if(today){const d=new Date().toISOString().slice(0,10);today.textContent=state.attendance.some(a=>a.date===d)?'Present':'Not yet';}}catch(err){if(err.message.includes('session'))logout();else flash(err.message,true);}}
async function loadReports(){try{state.attendance=await api('allAttendance',{token:state.token});const el=document.getElementById('reportsTable');if(el)el.innerHTML=attendanceTable(state.attendance,true);}catch(err){flash(err.message,true);}}
function attendanceTable(rows,admin){if(!rows.length)return '<div class="empty">No attendance records found.</div>';return `<div class="table-wrap"><table><thead><tr>${admin?'<th>Name</th><th>Role</th>':''}<th>Date</th><th>Time</th><th>Status</th><th>Location</th></tr></thead><tbody>${rows.map(a=>`<tr>${admin?`<td><b>${esc(a.fullName)}</b></td><td>${esc(a.role)}</td>`:''}<td>${esc(a.date)}</td><td>${esc(a.timestamp?new Date(a.timestamp).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}):'—')}</td><td><span class="pill">${esc(a.status)}</span></td><td>${a.latitude!==''&&a.latitude!=null?`${Number(a.latitude).toFixed(4)}, ${Number(a.longitude).toFixed(4)}${a.distanceMeters!==''&&a.distanceMeters!=null?` · ${esc(a.distanceMeters)} m`:''}`:'—'}</td></tr>`).join('')}</tbody></table></div>`;}
function go(page){state.page=page;state.message='';render();}
function logout(){state.token='';state.user=null;sessionStorage.removeItem('trinidax_token');sessionStorage.removeItem('trinidax_user');state.page='dashboard';renderAuth();}
function flashNoop(){}
if(state.user)render();else renderAuth();
</script>
</body>
</html>
